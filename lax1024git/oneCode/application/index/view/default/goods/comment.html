<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{$site_title}</title>
    {include file="public/js" /}
    <script src="__LIBS__/rater/rater.min.js?{$css_version}"></script>
</head>
<body style="font-size: 12px;">
<div id="app">
    {include file="public/header" /}
    <div class="wrap" id="hy-records" style="padding-top: 0;">
        <div class="records lists">

        </div>
    </div>
</div>
<script>
    $(function () {
        // 页数
        var page = 0;
        // dropload
        $('#hy-records').dropload({
            scrollArea: window,
            domUp:{
                domClass : 'dropload-up',
                domRefresh : '<div class="dropload-refresh">↓{:lang("下拉刷新")}</div>',
                domUpdate : '<div class="dropload-update">↑{:lang("释放更新")}</div>',
                domLoad : '<div class="dropload-load"><span class="loading"></span>{:lang("加载中")}...</div>'
            },
            domDown:{
                domClass : 'dropload-down',
                domRefresh : '<div class="dropload-refresh">↑{:lang("上拉加载更多")}</div>',
                domLoad : '<div class="dropload-load"><span class="loading"></span>{:lang("加载中")}...</div>',
                domNoData : '<div class="dropload-noData">{:lang("暂无数据")}</div>'
            },
            loadDownFn: function (me) {
                page++;
                $.ajax({
                    type: 'GET',
                    url: '{:url("comment", ["goods_id" => $goods_id])}?page=' + page,
                    dataType: 'json',
                    success: function (res) {
                        if (res.code == 1) {
                            $('.lists').append(res.data);
                            rating();
                        } else {
                            // 锁定
                            me.lock();
                            // 无数据
                            me.noData(true);
                        }
                        me.resetload();
                    },
                    error: function (xhr, type) {
                        // 即使加载出错，也得重置
                        me.resetload();
                    }
                });
            }
        });
        function rating() {
            var options = {
                    max_value: 5,
                    step_size: 0.01,
                    readonly:true
                }
            $(".rating").each(function(){
                $(this).rate(options);
            })
        }
    });
</script>
</body>
</html>
