<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{:lang('登录')}</title>
    {include file="public/js" /}
</head>
<body>
<div id="app">
    <div class="form">
        <div class="form-main">
            <div class="wel-grid">
                <div class="login-grid">
                    {if $setting.logo}
                    <img src="{$setting.logo|toMedia}" alt="">
                    {else}
                    <img src="__IMG__/login.png?{$css_version}" alt="">
                    {/if}
                </div>
            </div>
            <form class="form-panel ">
                <div class="input-title"><span>{:lang('手机号')}</span></div>
                <div class="van-cell van-cell--center van-field">
                    <div class="van-cell__value van-cell__value--alone van-field__value">
                        <div class="van-field__body">
                            <input type="text" autocomplete="mobile" name="mobile" id="mobile" placeholder="{:lang('请输入手机号')}" class="van-field__control">
                        </div>
                    </div>
                </div>
                <div class="input-title"><span>{:lang('密码')}</span></div>
                <div class="van-cell van-cell--center van-field">
                    <div class="van-cell__value van-cell__value--alone van-field__value">
                        <div class="van-field__body">
                            <input type="password" autocomplete="current-password" name="password" id="password" placeholder="{:lang('请输入密码')}" class="van-field__control">
                        </div>
                    </div>
                </div>
                <div></div>
            </form>
            <div class="btn-space" style="padding:20px 0 0 0;">
                <button class="van-button van-button--warning van-button--normal van-button--block" onclick="checkForm();" type="button">{:lang('登录')}</button>
                <div class="form-foot">
                    <p>{:lang('还没用注册账号?')} <a href="{:url('reg')}">{:lang('立即注册')}</a></p>
                    <!--<p class="end"><a href="{:url('password_mobile')}">{:lang('忘记密码')}</a></p>-->
                </div>
            </div>
        </div>
    </div> 
</div>
{include file="public/lang" /} 
{include file="public/stat" /} 
<script type="text/javascript">
    function checkForm(){
        var mobile           = $('#mobile').val();
        var password = $('#password').val();
        var KeepPWD          = $('#KeepPWD:checked').val();
        if(mobile == ''){
            layer.msg('{:lang("请填写手机号")}');
            return false;
        }
        if(password == ''){
            layer.msg('{:lang("请填写密码")}');
            return false;
        }
        if(!KeepPWD) KeepPWD = 0;
        $.ajax({
            type: "POST",
            url: '{:url("doLogin")}',
            data: {
                mobile: mobile,
                password: password,
                KeepPWD: KeepPWD
            },
            dataType: 'json',
            success: function(res){
                if(res.code == 200){
                    layer.msg('{:lang("登录成功")}', function(){
                        location.href = '{:url("index/index")}';
                    });
                } else {
                    layer.msg(res.msg);
                }
            }
        })
    }

    $(function(){
        $('img').bind("contextmenu",function(e){
            e.preventDefault();
        });
    });
    function kefu() {
        window.location.href = '{:url("service/index")}';
    }
    </script>
</script>
</body>
</html>
