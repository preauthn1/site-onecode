<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{:lang('找回密码')}</title>
    {include file="public/js" /}
    <script>
        var website_key = '{$recapatcha.website_key}';
        var verify_layer_index;
    </script>
    <script src="__LIBS__/slider-captcha/longbow.slidercaptcha.js"></script>
    <link rel="stylesheet" href="__LIBS__/slider-captcha/slidercaptcha.css?v2">
</head>
<body>
<div id="app">
    <div class="form">
        <div class="van-nav-bar__placeholder" >
            <div class="van-nav-bar van-nav-bar--fixed">
                <a href="javascript:history.back();" class="van-nav-bar__left">
                    <i class="van-icon van-icon-arrow-left van-nav-bar__arrow"></i>
                </a>
                <div class="van-nav-bar__title van-ellipsis">{:lang('找回密码')}</div>
                <div class="van-nav-bar__right"></div>
            </div>
        </div>
        <div class="form-main">
            <div class="form-panel regist-panel">
            {if $step == 1}
            <div class="van-cell van-cell--center van-field">
                <div class="van-field__left-icon"><img src="__IMG__/user.png" class="form-icon"></div>
                <div class="van-cell__title van-field__label"><span>{:lang('手机号')}</span></div>
                <div class="van-cell__value van-field__value">
                    <div class="van-field__body"><input type="text" name="mobile" id="mobile" placeholder="{:lang('请输入手机号')}" class="van-field__control"></div>
                </div>
            </div>
            <div class="van-cell van-cell--center van-field">
                <div class="van-field__left-icon"><img src="__IMG__/code.png" class="form-icon"></div>
                <div class="van-cell__title van-field__label"><span>{:lang('验证码')}</span></div>
                <div class="van-cell__value van-field__value">
                    <div class="van-field__body">
                        <input type="text" name="code" id="code" placeholder="{:lang('请输入手机验证码')}" class="van-field__control">
                        <input type="hidden" name="gRecaptchaResponse" id="gRecaptchaResponse"> 
                        <input type="hidden" name="smsverify" id="smsverify">
                        <div class="van-field__right-icon">
                            <button class="code-box" id="btnGetCode" onClick="sendMessage({$is_sms_verify})" data-re="{:lang('发送验证码')}">{:lang('发送验证码')}</button></div>
                    </div>
                </div>
            </div>

            <div class="btn-space" style="padding: 40px 0px 0px;">
                <button class="van-button van-button--warning van-button--normal van-button--block" onclick="next(1);">
                    <div class="van-button__content"><span class="van-button__text">{:lang('下一步')}</span></div>
                </button>
            </div>
            {elseif $step == 2}
            <div class="van-cell van-cell--center van-field">
                <div class="van-field__left-icon"><img src="__IMG__/lock1.png" class="form-icon"></div>
                <div class="van-cell__title van-field__label"><span>{:lang('密码')}</span></div>
                <div class="van-cell__value van-field__value">
                    <div class="van-field__body"><input type="password" name="password" id="password" placeholder="{:lang('请输入密码')}" class="van-field__control"></div>
                </div>
            </div>
            <div class="van-cell van-cell--center van-field">
                <div class="van-field__left-icon"><img src="__IMG__/lock2.png" class="form-icon"></div>
                <div class="van-cell__title van-field__label"><span>{:lang('确认密码')}</span></div>
                <div class="van-cell__value van-field__value">
                    <div class="van-field__body"><input type="password" name="repassword" id="repassword" placeholder="{:lang('请确认密码')}" class="van-field__control"></div>
                </div>
            </div>

            <div class="btn-space" style="padding: 40px 0px 0px;">
                <button class="van-button van-button--warning van-button--normal van-button--block" onclick="next(2);">
                    <div class="van-button__content"><span class="van-button__text">{:lang('确定修改')}</span></div>
                </button>
            </div>
            {/if}
            </div>
        </div>
    </div>
</div>
{include file="public/stat" /} 
<!--<script src="https://www.google.com/recaptcha/api.js?render={$recapatcha.website_key}"></script>-->
<script>
//igrecaptcha();
var width = parseInt($(document).innerWidth() * 0.65 - 4);
var sliderCaptchaOptions = {
    width: width,     // canvas宽度
    height: parseInt(width / (288/155)),    // canvas高度
    sliderL: parseInt(42 * (width/288)),    // 滑块边长
    sliderR: parseInt(9 * (width/288)),     // 滑块半径
    remoteUrl:"{:url('api/verify')}",
    loadingText: '{:lang("正在加载中")}...',
    failedText: '{:lang("再试一次")}',
    barText: '{:lang("向右滑动填充拼图")}',
    verify: function (arr, url) {
        var ret = false;
        $.ajax({
            url: url,
            data: JSON.stringify(arr),
            async: false,
            cache: false,
            type: 'POST',
            contentType: 'application/json',
            dataType: 'json',
            success: function (result) {
                ret = result.code;
                $("#smsverify").val(result.data)
            }
        });
        return ret;
    },
    onSuccess:function(){
        sendMessage(true)
        layer.close(verify_layer_index)
    },
    onFail:function(){
        $("#smsverify").val('')
    },
    onRefresh:function(){
        $("#smsverify").val('')
    },
};
</script>
<script>
    // 下一步
    var step = "{$step}";
    function next(step) {
        var mobile = $('#mobile').val();
        if(step == 1) { // 第一步
            if(mobile == ''){
                layer.msg("{:lang('请填写手机号')}")
                return false;
            }
            var verificationCode = $('#code').val();
            if(verificationCode == ''){
                layer.msg("{:lang('请填写手机验证码')}")
                return false;
            }
            var data = {
                mobile: mobile,
                code: verificationCode,
                step: 1
            }
        } else if(step == 2) {
            var password   = $('#password').val();
            var repassword = $('#repassword').val();
            if(password == '') {
                layer.msg("{:lang('请输入密码')}")
                return false;
            }
            if(repassword == '') {
                layer.msg("{:lang('请确认密码')}")
                return false;
            }
            if(password != repassword) {
                layer.msg("{:lang('两次密码不一致')}")
                return false;
            }
            var data = {
                password:   password,
                repassword: repassword,
                token:"{$token}",
                step:2
            }
        }
        $.ajax({
            type: "POST",
            url: '{:url("password_mobile")}',
            data: data,
            dataType: 'json',
            success: function(res){
                console.log(res);
                if(res.code == 200){
                    if (res.data) {
                        location.href = res.data;
                    }else{
                        layer.msg("{:lang('修改成功')}",function(){
                            location.href = '{:url("index")}';
                        });
                    }
                } else {
                    layer.msg(res.msg);
                }
            }
        })
    }
</script>
</html>
