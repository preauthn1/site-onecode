<div class="box2" style="margin:0px;">
    {volist name='lists' id='row'}
<div class="item">

    <div class="lt">
        <a href="{:url('goods/info', ['id' => $row.goods_id])}"><img class="proImg"src="{$row.goods.pic|toMedia}"></a>
    </div>
    <div class="rt-box-box guicen">
    <div class="rt-box">
        <div class="rt">
            <div class="title"><a href="{:url('goods/info', ['id' => $row.goods.goods_id])}">{$row.goods.goods_name}</a></div>
            <div class="price-box">
                <div  class="price1">{$row.goods.retail_price|i18n_currency} </div>
                <div  class="price2">{$row.goods.shop_price|i18n_currency}</div>
            </div>
            <div class="btm">
                <div class="yongjin">{:lang('佣金')}:{$row.goods.return_bonus|i18n_currency}</div>
            </div>
        </div>
    </div>
</div>
</div>
{/volist}
</div>
