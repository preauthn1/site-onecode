<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{$site_title}</title>
    {include file="public/js" /}
</head>
<body>
<div id="app">
        {if $setting.recharge_video}
        {php}
        $isRight = 1;
        $rightCon='<i class="czjc fa fa-question"></i>';
        {/php}
        {/if}
    {include file="public/header" /}
    <div class="wrap">
        <div class="rec-card">
            <div class="van-cell van-field">
                <div class="van-cell__title van-field__label"><span>{:lang('充值金额')}</span></div>
                <div class="van-cell__value van-field__value">
                    <div class="van-field__body"><input type="text" name="money" id="money" placeholder="{:lang('输入金额')}" class="van-field__control"></div>
                </div>
            </div>
        </div>
        <div class="price-list">
            <div class="van-row">
                {volist name='moneys' id='money'}
                <div class="van-col van-col--12">
                    <div class="price-box" data-id="{$money|intval}">{$money|i18n_currency}</div>
                </div>
                {/volist}
            </div>
        </div>
        <div class="btn-fixed">
            <button class="van-button van-button--warning van-button--normal van-button--block" onclick="next(1);">
                {:lang('下一步')}
            </button>
        </div>
    </div>
</div>
    
<textarea id="step2Tmp" style="display:none;">
    <div class="van-nav-bar__placeholder">
        <div class="van-nav-bar van-nav-bar--fixed">
            <a href="javascript:;" onclick="layer.closeAll();" class="van-nav-bar__left">
                <i class="van-icon van-icon-arrow-left van-nav-bar__arrow"></i>
            </a>
            <div class="van-nav-bar__title van-ellipsis">{:lang('请选择支付通道')}</div>
            <div class="van-nav-bar__right"></div>
        </div>
    </div>
    <div class="wrap">
        <div class="cus-list">
            {volist name='paylist' id='pay'}
            <a href="javascript:;" onclick="doPay('{$pay.type}', '{$pay.id}');" class="van-cell van-cell--clickable van-cell--center">
                {if $pay.logo}
                <img src="{$pay.logo|toMedia}" class="cus-icon">
                {/if}
                <div class="van-cell__title"><span>
                    {if $pay.bank_name}
                    {$pay.bank_name|lang}
                    {else}
                    {$pay.name|lang}
                    {/if}
                    </span></div>
                <i class="van-icon van-icon-arrow van-cell__right-icon"></i>
            </a>
            {/volist}
        </div>
    </div>
</textarea>
<textarea id="czjcTmp" style="display:none;">
    <div class="van-nav-bar__placeholder">
        <div class="van-nav-bar van-nav-bar--fixed">
            <a href="javascript:;" onclick="layer.closeAll();" class="van-nav-bar__left">
                <i class="van-icon van-icon-arrow-left van-nav-bar__arrow"></i>
            </a>
            <div class="van-nav-bar__title van-ellipsis">{:lang('我知道了')}</div>
            <div class="van-nav-bar__right"></div>
        </div>
    </div>
    <div class="wrap">
        <div class="know-video"><div id="ytplayer"><img src="__IMG__/zhidao.png" alt=""></div></div>
        <div class="btn-rows van-row" style="margin-top:20px;">
            <div class="van-col van-col--24">
                <button class="van-button van-button--warning van-button--normal van-button--block" onclick="layer.closeAll();">
                    {:lang('我知道了')}
                </button>
            </div>
        </div>
    </div>
</textarea>

<script>
  // Load the IFrame Player API code asynchronously.
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/player_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
</script>
<script type="text/javascript">
    $(".czjc").on("click", function(){
        var html = $("#czjcTmp").val();
        layer.open({
            type: 1,
            content: html,
            title: false,
            closeBtn: 0,
            anim: 'up',
            skin: 'diy-layer',
            success:function(){
                var player;
                player = new YT.Player('ytplayer', {
                  height: $(document).innerHeight() - 180,
                  width: $(document).innerWidth() - 40,
                  videoId: '{$setting.recharge_video}'
                });
            }
        });
    });
    
    $('.price-box').on('click', function(){
        $('#money').val($(this).data('id'));
    });
    // 下一步
    var step = 1;
    function next(step) {
        if(step == 1) { // 第一步
            var money = $('#money').val();
            if(money == ''){
                layer.msg("{:lang('请填写充值金额')}")
                return false;
            }
            if (money > 5000) {
//                $("#to_alipay").hide();
            }
            var html = $("#step2Tmp").val();
            layer.open({
                type: 1,
                content: html,
                title: false,
                closeBtn: 0,
                anim: 'up',
                skin: 'diy-layer'
            });
        }
    }
    // 去充值
    function doPay(type, pay_id) {
        var money = $('#money').val();
        if(money == ''){
            layer.msg("{:lang('请填写充值金额')}")
            return false;
        }
        var url = '{:url("pay")}?money=' + money + "&type=" + type;
        if (pay_id) {
            url += '&pay_id='+pay_id
        }
        window.location.href = url;
    }
</script>
</body>
</html>
