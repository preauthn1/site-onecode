<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{:lang("团队报表")}</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link href="__CSS__/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="__CSS__/font-awesome.min.css?v=4.4.0" rel="stylesheet">
    <link href="__CSS__/plugins/bootstrap-table/bootstrap-table.min.css" rel="stylesheet">
    <link href="__CSS__/animate.min.css" rel="stylesheet">
    <link href="__CSS__/style.min.css?v=4.1.0" rel="stylesheet">
    <link href="__CSS__/plugins/sweetalert/sweetalert.css" rel="stylesheet">
    <link href="__JS__/layui/css/layui.css" rel="stylesheet">
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            {:lang("团队报表")}
        </div>
        <div class="ibox-content">
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("用户ID或账号")}：</label>
                        <input type="text" class="form-control" id="username" name="username" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" value="{$startTime}" id="start_time" name="startTime" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" value="{$endTime}" id="end_time" name="endTime" placeholder="yyyy-MM-dd" lay-key="2" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>{:lang("上级ID")}：</label>
                        <input type="text" class="form-control" readonly value='{$id}' autocomplete="off">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong></button>
                        {if $id>0}
                        <button class="btn btn-default" type="button" style="margin-top:5px" onclick=" window.history.go(-1);"><strong>返 回</strong></button>
                        {/if}
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable" data-toolbar="#toolbar">
                        <thead>
                        <th data-field="id" data-formatter="textFormatter">{:lang("用户ID")}</th>
                        <th data-field="nick_name" data-formatter="textFormatter">{:lang("昵称")}</th>
                        <th data-field="true_name" data-formatter="textFormatter">{:lang("姓名")}</th>
                        <th data-field="mobile" data-formatter="textFormatter">{:lang("账号")}</th>
                        <th data-field="team_users">{:lang("团队人数")}</th>
                        <th data-field="total_active_user">{:lang("活跃人数")}</th>
                        <th data-field="total_recharge">{:lang("充值总额")}</th>
                        <th data-field="total_withdraw">{:lang("提现总额")}</th>
                        <th data-field="wr_diff" data-formatter="moneyFormatter">{:lang("存取差额")}</th>
<!--                        <th data-field="total_order_price">刷单商品总额</th>
                        <th data-field="total_order_gray">佣金总额</th>
                        <th data-field="total_order_rebate">佣金提成总额</th>
                        <th data-field="total_order_count">刷单总数</th>
                        <th data-field="total_handsel">手工赠金总和</th>-->
                        <th data-field="total_frozen_money">{:lang("冻结金额总和")}</th>
                        <th data-field="total_user_money">{:lang("总余额")}</th>
                        <th data-field="create_time">{:lang("注册时间")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
</div>
<!-- End Panel Other -->
<script src="__JS__/jquery.min.js?v=2.1.4"></script>
<script src="__JS__/bootstrap.min.js?v=3.3.6"></script>
<script src="__JS__/content.min.js?v=1.0.0"></script>
<script src="__JS__/plugins/bootstrap-table/bootstrap-table.min.js"></script>
<script src="__JS__/plugins/bootstrap-table/bootstrap-table-mobile.min.js"></script>
<script src="__JS__/plugins/bootstrap-table/locale/bootstrap-table-zh-CN.min.js"></script>
<script src="__JS__/plugins/suggest/bootstrap-suggest.min.js"></script>
<script src="__JS__/plugins/sweetalert/sweetalert.min.js"></script>
<script src="__JS__/plugins/layer3/layer.js"></script>
<script src="__JS__/layui/layui.js"></script>
<script type="text/javascript">
    var $table = $('#cusTable');
    function textFormatter(value, row, index) {
        if (row.is_xuni == 1) {
            return "<span style='color:red'>"+value+"</span>";
        }
        return "<span>"+value+"</span>";
    }
    function moneyFormatter(value, row, index) {
        if (value < 0) {
            return "<span style='color:red'>"+value+"</span>";
        }
        return "<span style='color:green'>"+value+"</span>";
    }
    function initTable() {
        //先销毁表格
        $table.bootstrapTable('destroy');
        //初始化表格,动态从服务器加载数据
        $table.bootstrapTable({
            method: "get",  //使用get请求到服务器获取数据
            url: "{$url}", //获取数据的地址
            striped: true,  //表格显示条纹
            pagination: true, //启动分页
            pageSize: 10,  //每页显示的记录数
            pageNumber:1, //当前第几页
            pageList: [10, 30, 50, 100, 500],  //记录数可选列表
            sidePagination: "server", //表示服务端请求
            paginationFirstText: "{:lang('首页')}",
            paginationPreText: "{:lang('上一页')}",
            paginationNextText: "{:lang('下一页')}",
            paginationLastText: "{:lang('尾页')}",
            queryParamsType : "undefined",
            queryParams: function queryParams(params) {   //设置查询参数
                params.searchText = $('#username').val();
                params.startTime = $('#start_time').val(); 
                params.endTime = $('#end_time').val();
                return params;
            },
            onLoadSuccess: function(res){  //加载成功时执行
                if(111 == res.code){
                    window.location.reload();
                }
                layer.msg("{:lang('加载成功')}", {time : 1000});
            },
            onLoadError: function(){  //加载失败时执行
                layer.msg("{:lang('加载数据失败')}");
            }
        });
    }

    $(document).ready(function () {
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                ,trigger: 'click'
            });
        });
        //调用函数，初始化表格
        initTable();

        //当点击查询按钮的时候执行
        $("#search").on("click", initTable);
    });
</script>
</body>
</html>
