<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{:lang("银行卡充值列表")}</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link href="__CSS__/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="__CSS__/font-awesome.min.css?v=4.4.0" rel="stylesheet">
    <link href="__CSS__/plugins/bootstrap-table/bootstrap-table.min.css" rel="stylesheet">
    <link href="__CSS__/animate.min.css" rel="stylesheet">
    <link href="__CSS__/style.min.css?v=4.1.0" rel="stylesheet">
    <link href="__CSS__/plugins/sweetalert/sweetalert.css" rel="stylesheet">
    <link href="__JS__/layui/css/layui.css" rel="stylesheet">
    <style>
        .operateBox{
            padding: 10px 15px;
        }
    </style>
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("银行卡充值列表")}</h5>
        </div>
        <div class="ibox-content">
            <div id="toolbar">
                <div id="stats" style=' float: right; padding: 8px 12px'></div>
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline" target="_blank">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" id="start_time" name="startTime" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" id="end_time" name="endTime" placeholder="yyyy-MM-dd" lay-key="2" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>{:lang("状态")}：</label>
                        <select class="form-control" name="searchStatus" id="status" >
                            <option value="">{:lang("请选择")}</option>
                            {if !empty($status)}
                            {foreach name="status" item="vo"}
                            <option value="{$key}">{$vo}</option>
                            {/foreach}
                            {/if}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("用户")}：</label>
                        <select class="form-control" name="vuser" id="vuser" >
                            <option value="-1">{:lang("所有")}</option>
                            <option value="0">{:lang("真实")}</option>
                            <option value="1">{:lang("虚拟")}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("搜索")}：</label>
                        <input type="text" class="form-control" id="realname" name="searchText" placeholder="{:lang('手机号码/订单号/姓名')}">
                    </div>
                    <div class="form-group">
                        <input type="hidden" value="1" name="export"/>
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong></button>
                        <button class="btn btn-danger" type="submit" style="margin-top:5px" id="export"><strong>{:lang("导出")}</strong></button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable" 
                           data-toolbar="#toolbar"
                        >
                        <thead>
                        <th data-field="id">ID</th>
                        <th data-field="order_id" data-formatter="text2Formatter">{:lang("订单号")}</th>
                        <th data-field="car_num" data-formatter="text2Formatter">{:lang("收款账号")}</th>
                        <th data-field="true_name" data-formatter="text2Formatter">{:lang("真实姓名")}</th>
                        <th data-field="mobile" data-formatter="text2Formatter">{:lang("联系电话")}</th>
                        <th data-field="user_note" data-formatter="text2Formatter">{:lang("付款类型")}</th>
                        <th data-field="pay_account" data-formatter="text2Formatter">{:lang("付款账户")}</th>
                        <th data-field="money" data-sortable="true">{:lang("金额")}</th>
                        <th data-field="type">{:lang("类型")}</th>
                        <th data-field="status_text">{:lang("状态")}</th>
                        <th data-field="create_time" data-sortable="true">{:lang("时间")}</th>
                        <th data-field="remark" data-formatter="textFormatter">{:lang("审核备注")}</th>
                        <th data-field="ip">{:lang("IP地址")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
</div>
<!-- End Panel Other -->
<script src="__JS__/jquery.min.js?v=2.1.4"></script>
<script src="__JS__/bootstrap.min.js?v=3.3.6"></script>
<script src="__JS__/content.min.js?v=1.0.0"></script>
<script src="__JS__/plugins/bootstrap-table/bootstrap-table.min.js"></script>
<script src="__JS__/plugins/bootstrap-table/bootstrap-table-mobile.min.js"></script>
<script src="__JS__/plugins/bootstrap-table/locale/bootstrap-table-zh-CN.min.js"></script>
<script src="__JS__/plugins/suggest/bootstrap-suggest.min.js"></script>
<script src="__JS__/plugins/sweetalert/sweetalert.min.js"></script>
<script src="__JS__/plugins/layer3/layer.js"></script>
<script src="__JS__/layui/layui.js"></script>
<script type="text/javascript">
    var $table = $('#cusTable');
    function stateFormatter(value, row, index) {
        if (row.status !== 1) {
            return {
                disabled: true
            }
        }
        return value;
    }
    function textFormatter(value, row, index) {
        return (row.img ? row.img : '') + value;
    }
    function text2Formatter(value, row, index) {
        if (row.is_xuni == 1) {
            return "<span style='color:red'>"+value+"</span>";
        }
        return "<span>"+value+"</span>";
    }
    function getIdSelections() {
        return $.map($table.bootstrapTable('getSelections'), function (row) {
          return row.id
        })
    }
    function initTable() {
        //先销毁表格
        $table.bootstrapTable('destroy');
        //初始化表格,动态从服务器加载数据
        $table.bootstrapTable({
            method: "get",  //使用get请求到服务器获取数据
            url: "./index", //获取数据的地址
            striped: true,  //表格显示条纹
            pagination: true, //启动分页
            pageSize: 100,  //每页显示的记录数
            pageNumber:1, //当前第几页
            pageList: [10, 30, 50, 100, 500],  //记录数可选列表
            sidePagination: "server", //表示服务端请求
            paginationFirstText: "{:lang('首页')}",
            paginationPreText: "{:lang('上一页')}",
            paginationNextText: "{:lang('下一页')}",
            paginationLastText: "{:lang('尾页')}",
            queryParamsType : "undefined",
            queryParams: function queryParams(params) {   //设置查询参数
                params.searchText = $('#realname').val();
                params.searchStatus = $('#status').val();
                params.startTime = $('#start_time').val(); 
                params.endTime = $('#end_time').val();
                params.vuser = $('#vuser').val();
                return params;
            },
            onLoadSuccess: function(res){  //加载成功时执行
                if(111 == res.code){
                    window.location.reload();
                }
                var stathtml = '';
                if (res.stat) {
                    $.each(res.stat, function(i, v){
                        stathtml += '<span class="label label-success">'+v.text+'：'+v.total+'</span> ';
                    })
                }
                $("#stats").html(stathtml);
                layer.msg("{:lang('加载成功')}", {time : 1000});
            },
            onLoadError: function(){  //加载失败时执行
                layer.msg("{:lang('加载数据失败')}");
            }
        });
    }

    $(document).ready(function () {
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                ,trigger: 'click'
            });
        });
        //调用函数，初始化表格
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });

</script>
</body>
</html>
