{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>幻灯列表</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-1">
                {if authCheck('banner/add') }
                <a href="{:url('banner/add')}">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("添加幻灯")}</button>
                </a>
                {/if}
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("幻灯名称")}：</label>
                        <input type="text" class="form-control" id="name" name="name">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-field="sort">{:lang("排序")}</th>
                        <th data-field="lang">{:lang("语言")}</th>
                        <th data-field="pic">{:lang("图片")}</th>
                        <th data-field="name">{:lang("幻灯名称")}</th>
                        <th data-field="status">{:lang("状态")}</th>
                        <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
<script type="text/javascript">
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.searchText = $('#name').val()
        return params;
    }
    function stateFormatter(value, row, index) {
        if (row.thumb) {
            return '<img src="'+row.thumb+'" style="height:16px;" /> ' + value;
        }
        console.log(row)
        return value;
    }
</script>
{include file="footer" /}
