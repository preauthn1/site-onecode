<div class="form-group">
    <label class="col-sm-3 control-label"><span class="x-red">*</span>{:lang("是否是优惠商品")}：</label>
    <div class="input-group col-sm-6">
        <div class="radio i-checks col-sm-4">
            <label> <input type="radio" value="1" name="is_discount" {$info.is_discount==1?'checked':''}> <i></i> {:lang("是")}</label>
        </div>
        <div class="radio i-checks col-sm-4">
            <label> <input type="radio" value="0" name="is_discount" {$info.is_discount!=1?'checked':''}> <i></i> {:lang("否")}</label>
        </div>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("排序")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" value="{$info.sort|intval}" name="sort" />
        <p class="help-block">{:lang("数字越小的排在前面")}</p>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-3 control-label"><span class="x-red">*</span>{:lang("商品名称")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" value="{$info.goods_name}" name="goods_name" required />
    </div>
</div>

            {/if}

    </div>
</div>-->
<div class="form-group">
    <label class="col-sm-3 control-label"><span class="x-red">*</span>{:lang("商品分类")}：</label>
    <div class="input-group col-sm-4">
        <select class="form-control" name="cate_id" id="cate_id" required>
            <option value="0">{:lang("默认分类")}</option>
            {foreach name="cates" item="vo"}
            <option value="{$vo.id}" {if $info.cate_id eq $vo.id} selected{/if}>{$vo.name|lang}</option>
            {/foreach}
        </select>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-3 control-label"><span class="x-red">*</span>{:lang("是否上架")}：</label>
    <div class="input-group col-sm-6">
        {foreach name='status' item='vo' key='key'}
        <div class="radio i-checks col-sm-4">
            {if condition="$key == 1 " }
            <label> <input type="radio" value="{$key}" checked name="status"> <i></i> {$vo|lang}</label>
            {else}
            <label> <input type="radio" value="{$key}" name="status"> <i></i> {$vo|lang}</label>
            {/if} 
        </div>
        {/foreach}
    </div>
</div>
<div class="form-group">
    <label class="col-sm-3 control-label">
        <span class="x-red">*</span>{:lang("最低拼单人数")}
    </label>
    <div class="input-group col-sm-4">
        <input type="number" min="2" max="100" name="order_number" required value="{$info.order_number|intval}" class="form-control">
    </div>
</div>
<div class="form-group">
    <label class="col-sm-3 control-label">
        <span class="x-red">*</span>{:lang("实际价格")}
    </label>
    <div class="input-group col-sm-4">
        <input type="number" min="1" id="costPrice" name="shop_price" required value="{$info.shop_price|floatval}" class="form-control">
    </div>
</div>

<div class="form-group">
    <label class="col-sm-3 control-label">
        <span class="x-red">*</span>{:lang("拼单价格")}
    </label>
    <div class="input-group col-sm-4">
        <input type="number" min="1" id="retailPrice" name="retail_price" required value="{$info.retail_price|floatval}" class="form-control">
        <div class="help-block intervalText"></div>
    </div>
</div>

<div class="form-group">
    <label class="col-sm-3 control-label">
        <span class="x-red">*</span>{:lang("佣金")}
    </label>
    <div class="input-group col-sm-4">
        <input type="number" min="1" id="returnBonus" name="return_bonus" required value="{$info.return_bonus|floatval}" class="form-control">
        <div class="help-block rebateRatio"></div>
    </div>
</div>

<div class="form-group">
    <label class="col-sm-3 control-label"><span class="x-red">*</span>{:lang("封面图片")}：</label>
    <input name="pic" id="img" value="{$info.pic}" type="hidden" />
    <div class="form-inline">
        <div class="input-group col-sm-2">
            <button type="button" class="layui-btn" id="uploader">
                <i class="layui-icon">&#xe67c;</i>{:lang("上传图片")}
            </button>
        </div>
        <div class="input-group col-sm-3">
            <div id="sm">{if $info.pic}<img src="{$info.pic|toMedia}" style="width:40px; height: 40px;"/>{/if}</div>
        </div>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-3 control-label"><span class="x-red">*</span>{:lang("商品主图")}</label>
    <input name="main_pic" id="main_pic" value="{$info.main_pic}" type="hidden" />
    <div class="form-inline">
        <div class="input-group col-sm-2">
            <button type="button" class="layui-btn" id="addMainImg" style="width: 100%;">
                <i class="layui-icon">&#xe67c;</i> {:lang("选择图片")} | <span id="item_main_img_tip">{$info.main_pic_arr|count}</span> / 6
            </button>
        </div>
    </div>
</div>
<div class="form-group">
    <div class="input-group col-sm-8 col-sm-offset-3">
        <div class="help-block">
            {:lang("图片支持png、jpg、jpeg格式")}，<br >
            {:lang("建议图片尺寸为800*800px，或者更大的尺寸；图片大小请小于1M。")}
        </div>
    </div>
</div>
<div class="form-group">
    <div class="input-group col-sm-8 col-sm-offset-3">
        <ul id="imgMainList" style="max-width: 600px; width: 100%;min-height:auto;">
            {volist name='info.main_pic_arr' id='path'}
            <li data-path="{$path}" style="position:relative">
                <img name="imgMainList" src="{$path|toMedia}" width="150" height="113">
                <div class="img_close" onclick="deleteElement(this, 'item_main_img_tip')">X</div>
            </li>
            {/volist}
        </ul>
    </div>
</div>
