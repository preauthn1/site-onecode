{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{$title|lang}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-7">
                {if authCheck('text/add')}
                <a href="{:url('add')}">
                    <button class="btn btn-outline btn-primary" type="button">{:lang("添加")}</button>
                </a>
                {/if}
                <a href="{:url('index', ['act' => 'all'])}">
                    <button class="btn btn-outline btn-info" type="button">{:lang("查看所有")}</button>
                </a>
                <a href="{:url('index', ['act' => 'export'])}">
                    <button class="btn btn-outline btn-info" type="button">{:lang("导出")}</button>
                </a>
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("文字")}：</label>
                        <input type="text" class="form-control" id="title" name="title">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-field="title" data-formatter="textFormatter">{:lang('文字')}</th>
                        {volist name='langs' id='row'}
                        <th data-field="text_{$row.id}" data-formatter="textFormatter"><span title="{$row.remark|lang}">{$row.title|lang}</span></th>
                        {/volist}
                        <th data-field="operate">{:lang('操作')}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
    <style>
        .text{
            width: 150px;
        }
        .text-hide2 {
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }
    </style>
<script type="text/javascript">
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.searchText = $('#title').val()
        return params;
    }
    function textFormatter(value, row, index) {
        var patt = /<img/g;
        var result = patt.test(value);
        if (result) {
            return value;
        }
        return value ? '<p class="text text-hide2" data-toggle="tooltip" title="'+value+'">'+value+'</p>' : '-';
    }
    $(document).on('click', ".text", function(){
        $(this).toggleClass('text-hide2');
    });
</script>
{include file="footer" /}
