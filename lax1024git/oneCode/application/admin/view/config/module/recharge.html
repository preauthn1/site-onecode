<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("充值开关")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" name="recharge_open" value="{$config.recharge_open|default=1}">
        <p class="help-block">是否开启：0关闭，1开启</p>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("充值默认金额数字")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" name="recharge_default_money" value="{$config.recharge_default_money}">
        <p class="help-block">多个用英文逗号[,]分隔 </p>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("最小充值金额")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" name="recharge_min_money" value="{$config.recharge_min_money|intval}">
    </div>
</div>
<div class="form-group">
    <label class="col-sm-3 control-label">{:lang("充值教程视频ID")}：</label>
    <div class="input-group col-sm-4">
        <input type="text" class="form-control" name="recharge_video" value="{$config.recharge_video}">
        <p class="help-block">只支持YouTube视频，获取视频id <br>
            https://youtu.be/<span style="color:red;">UCg9i5oHtI0</span><br>
            https://www.youtube.com/watch?v=<span style="color:red;">UCg9i5oHtI0</span><br>
            以上视频链接的视频ID为：<code style="color:red;">UCg9i5oHtI0</code>
        </p>
    </div>
</div>
