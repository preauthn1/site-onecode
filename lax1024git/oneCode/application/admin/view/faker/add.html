<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加造假数据</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link href="__CSS__/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="__CSS__/font-awesome.min.css?v=4.4.0" rel="stylesheet">
    <link href="__CSS__/animate.min.css" rel="stylesheet">
    <link href="__CSS__/plugins/iCheck/custom.css" rel="stylesheet">
    <link href="__CSS__/style.min.css?v=4.1.0" rel="stylesheet">
    <link href="__JS__/plugins/bootstrap-tagsinput/bootstrap-tagsinput.css" rel="stylesheet">
    <link href="__JS__/layui/css/layui.css" rel="stylesheet">
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-8">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{:lang("添加造假数据")}</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="commentForm" method="post" action="{:url('add')}">
                        <input type="hidden" name="id" value="{$info.id}"/>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("用户ID")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="user_id" type="text" class="form-control" value="{$info.user_id}" name="user_id" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("用户余额")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="user_money" type="text" class="form-control" value="{$info.user_money}" name="user_money" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("今日抢单佣金")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="today_self_gray" type="text" class="form-control" value="{$info.today_self_gray}" name="today_self_gray" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("今日抢单数量")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="today_qiangdan_num" type="text" class="form-control" value="{$info.today_qiangdan_num}" name="today_qiangdan_num" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("总充人数")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="fristcz" type="text" class="form-control" value="{$info.fristcz}" name="fristcz" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("直推人数")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="nextcount" type="text" class="form-control" value="{$info.nextcount}" name="nextcount" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("团队人数")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="teamcount" type="text" class="form-control" value="{$info.teamcount}" name="teamcount" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("当天团队收益")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="teamgray" type="text" class="form-control" value="{$info.teamgray}" name="teamgray" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("累计团队收益")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="total_teamgray" type="text" class="form-control" value="{$info.total_teamgray}" name="total_teamgray" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("新增人数")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="newcount" type="text" class="form-control" value="{$info.newcount}" name="newcount" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("活跃人数")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="nowcount" type="text" class="form-control" value="{$info.nowcount}" name="nowcount" required="" aria-required="true">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("一级会员")}：</label>
                            <div class="input-group col-sm-4">
                                <textarea class="form-control" name="one_lv_users" id="one_lv_users" required="" placeholder="格式：账号,余额,电话,注册时间">{$info.one_lv_users}</textarea>
                                <span class="help-block">格式：账号,余额,电话,注册时间; 每行一个</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("二级会员")}：</label>
                            <div class="input-group col-sm-4">
                                <textarea class="form-control" name="two_lv_users" id="two_lv_users" required="" placeholder="格式：账号,余额,电话,注册时间">{$info.two_lv_users}</textarea>
                                <span class="help-block">格式：账号,余额,电话,注册时间; 每行一个</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("三级会员")}：</label>
                            <div class="input-group col-sm-4">
                                <textarea class="form-control" name="three_lv_users" id="three_lv_users" required="" placeholder="格式：账号,余额,电话,注册时间">{$info.three_lv_users}</textarea>
                                <span class="help-block">格式：账号,余额,电话,注册时间; 每行一个</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("账户明细")}：</label>
                            <div class="input-group col-sm-4">
                                <textarea class="form-control" name="money_log" id="money_log" required="" placeholder="格式：操作金额,类型,时间">{$info.money_log}</textarea>
                                <span class="help-block">格式：操作金额,类型,时间; 每行一条记录</span>
                                <span class="help-block">类型：0:系统变更,1:充值,2:分佣奖励,3:抢单支付,4:佣金返还,5:用户存储-存入,6:用户存储-取出,7:提现,8:提现失败</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("充值记录")}：</label>
                            <div class="input-group col-sm-4">
                                <textarea class="form-control" name="recharge_log" id="recharge_log" required="" placeholder="格式：充值金额,订单号,时间,收款账号">{$info.recharge_log}</textarea>
                                <span class="help-block">格式：充值金额,订单号,时间,收款账号; 每行一条记录</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("提现记录")}：</label>
                            <div class="input-group col-sm-4">
                                <textarea class="form-control" name="cash_log" id="cash_log" required="" placeholder="格式：提现金额,卡号,备注">{$info.cash_log}</textarea>
                                <span class="help-block">格式：提现金额,卡号,时间,备注; 每行一条记录</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-6">
                                <!--<input type="button" value="提交" class="btn btn-primary" id="postform"/>-->
                                <button class="btn btn-primary" type="submit">{:lang("提交")}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="__JS__/jquery.min.js?v=2.1.4"></script>
<script src="__JS__/bootstrap.min.js?v=3.3.6"></script>
<script src="__JS__/content.min.js?v=1.0.0"></script>
<script src="__JS__/plugins/bootstrap-tagsinput/bootstrap-tagsinput.min.js"></script>
<script src="__JS__/plugins/webuploader/webuploader.min.js"></script>
<script src="__JS__/plugins/validate/jquery.validate.min.js"></script>
<script src="__JS__/plugins/validate/messages_zh.min.js"></script>
<script src="__JS__/plugins/iCheck/icheck.min.js"></script>
<script src="__JS__/plugins/layer/laydate/laydate.js"></script>
<script src="__JS__/plugins/layer/layer.min.js"></script>
<script src="__JS__/layui/layui.js"></script>
<script src="__JS__/jquery.form.js"></script>
<script src="__JS__/plugins/ueditor/ueditor.config.js"></script>
<script src="__JS__/plugins/ueditor/ueditor.all.js"></script>
<script type="text/javascript">
    var index = '';
    function showStart(){
        index = layer.load(0, {shade: false});
        return true;
    }

    function showSuccess(res){
        layer.ready(function(){
            layer.close(index);
            if(1 == res.code){
               layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(){
                   window.location.href = res.data;
               });
            }else if(111 == res.code){
                window.location.reload();
            }else{
                layer.msg(res.msg, {anim: 6});
            }
        });
    }

    $(document).ready(function(){
        $(".i-checks").iCheck({checkboxClass:"icheckbox_square-green",radioClass:"iradio_square-green",});
        // 添加商品
        var options = {
            beforeSubmit:showStart,
            success:showSuccess
        };
        // 提交订单
        $('#commentForm').submit(function(){
            $(this).ajaxSubmit(options);
            return false;
        });
    });

    // 表单验证
    $.validator.setDefaults({
        highlight: function(e) {
            $(e).closest(".form-group").removeClass("has-success").addClass("has-error")
        },
        success: function(e) {
            e.closest(".form-group").removeClass("has-error").addClass("has-success")
        },
        errorElement: "span",
        errorPlacement: function(e, r) {
            e.appendTo(r.is(":radio") || r.is(":checkbox") ? r.parent().parent().parent() : r.parent())
        },
        errorClass: "help-block m-b-none",
        validClass: "help-block m-b-none"
    });

</script>
</body>
</html>
