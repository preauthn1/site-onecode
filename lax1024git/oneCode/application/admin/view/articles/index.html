{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{$title|lang}</h5>
        </div>
        <div class="ibox-content">
            <div class="form-group clearfix col-sm-1">
                {if authCheck('articles/add')}
                <a href="{:url('articles/add')}"><button class="btn btn-outline btn-primary" type="button">{:lang("添加文章")}</button></a>
                {/if}
            </div>
            <!--搜索框开始-->
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("语言")}：</label>
                        <select class="form-control" id="lang" name="lang">
                            <option value="">所有</option>
                            {volist name='langs' id='vo'}
                            <option value="{$key}">{$vo|lang}</option>
                            {/volist}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("文章类型")}：</label>
                        <select class="form-control" id="is_nav" name="is_nav">
                            <option value="">所有</option>
                            {volist name='article_navs' id='text'}
                            <option value="{$key}">{$text|lang}</option>
                            {/volist}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("文章标题")}：</label>
                        <input type="text" class="form-control" id="title" name="title">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->

            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                            <th data-field="sort">{:lang("排序")}</th>
                            <th data-field="lang">{:lang("语言")}</th>
                            <th data-field="title" data-formatter="stateFormatter">{:lang("文章标题")}</th>
                            <th data-field="status">{:lang("状态")}</th>
                            <th data-field="is_nav">{:lang("菜单")}</th>
                            <th data-field="url">{:lang("url")}</th>
                            <th data-field="create_time">{:lang("添加时间")}</th>
                            <th data-field="update_time">{:lang("更新时间")}</th>
                            <th data-field="operate">{:lang("操作")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
<script type="text/javascript">
    $(document).ready(function () {
        initTable();
        //当点击查询按钮的时候执行
        $("#search").bind("click", initTable);
    });
    function queryParams(params) {   //设置查询参数
        params.searchText = $('#title').val();
        params.lang = $('#lang').val();
        params.is_nav = $('#is_nav').val();
        return params;
    }
    function stateFormatter(value, row, index) {
        if (row.thumb) {
            return '<img src="'+row.thumb+'" style="height:16px;" /> ' + value;
        }
        console.log(row)
        return value;
    }
</script>
{include file="footer" /}
