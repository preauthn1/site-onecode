{include file="header" /}
    <!-- Panel Other -->
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>{:lang("余额调整")}</h5>
        </div>
        <div class="ibox-content">
            <!--搜索框开始-->
            {if authCheck('member/moneyadd') }
            <form id='dataForm' role="form" method="post" action="{:url('member/moneyadd')}" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("操作类型")}：</label>
                        <select class="form-control" name="usertype" id="usertype" >
                            <option value="">{:lang("选择类型")}</option>
                            <option value="1">{:lang("彩金")}</option>
                            <option value="2">{:lang("充值")}</option>
                            <option value="3">{:lang("积分")}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("金额")}：</label>
                        <input type="text" style="width: 220px;" placeholder="{:lang('正数为加分,负数为减分')}" class="form-control" required id="money" name="money">
                    </div>
                    <div class="form-group">
                        <label>{:lang("说明")}：</label>
                        <input type="text" class="form-control" id="remarks" name="remarks">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-danger" onclick="return window.confirm('{:lang("确认操作")}?')" type="submit" style="margin-top:5px"><strong>{:lang("确定")}</strong> </button>
                    </div>
                </div>
                <input type="hidden" id="user_id" name="user_id" value="{$uid}" />
            </form>
            {/if}
            <div id="stats" style=' float: left; padding: 8px 12px'></div>
            <form id='commentForm' role="form" method="post" class="form-inline pull-right">
                <div class="content clearfix m-b">
                    <div class="form-group">
                        <label>{:lang("选择时间")}：</label>
                        <input type="text" class="form-control" id="start_time" name="startTime" value="{:getDateStr()}" placeholder="yyyy-MM-dd" lay-key="1" autocomplete="off">
                        -
                        <input type="text" class="form-control" id="end_time" name="endTime" value="{:getDateStr()}" placeholder="yyyy-MM-dd" lay-key="2" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>{:lang("类型")}：</label>
                        <select class="form-control" name="type" id="type" >
                            <option value="">所有</option>
                            {volist name='money_type' id='text'}
                            <option value="{$key}">{$text|lang}</option>
                            {/volist}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>{:lang("来自用户ID")}：</label>
                        <input type="text" class="form-control" id="from_user_id" name="from_user_id">
                    </div>
                    <div class="form-group">
                        <label>{:lang("订单ID")}：</label>
                        <input type="text" class="form-control" id="order_id" name="order_id">
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="button" style="margin-top:5px" id="search"><strong>{:lang('搜索')}</strong>
                        </button>
                    </div>
                </div>
            </form>
            <!--搜索框结束-->
            <div class="example-wrap">
                <div class="example">
                    <table id="cusTable">
                        <thead>
                        <th data-field="user_id">{:lang("用户ID")}</th>
                        <th data-field="money">{:lang("金额")}</th>
                        <th data-field="user_money">{:lang("账变后账户余额")}</th>
                        <th data-field="type">{:lang("类型")}</th>
                        <th data-field="remarks">{:lang("说明")}</th>
                        <th data-field="from_user_id">{:lang("来自用户ID")}</th>
                        <th data-field="order_id">{:lang("订单ID")}</th>
                        <th data-field="admin_name">{:lang("管理员")}</th>
                        <th data-field="create_time">{:lang("时间")}</th>
                        </thead>
                    </table>
                </div>
            </div>
            <!-- End Example Pagination -->
        </div>
    </div>
</div>
<script type="text/javascript">
    index_url = '{:url("money_log/index")}';
    function queryParams(params) {   //设置查询参数
        params.type = $('#type').val(); 
        params.username = $('#username').val(); 
        params.startTime = $('#start_time').val(); 
        params.endTime = $('#end_time').val();
        params.from_user_id = $('#from_user_id').val();
        params.order_id = $('#order_id').val();
        params.userId = "{$uid}";
        return params;
    }
    function onLoadSuccess(res) {
        var stathtml = '';
        if (res.stat) {
            $.each(res.stat, function(i, v){
                stathtml += '<span class="label label-success">'+v.text+'：'+v.total+'</span> ';
            });
        }
        $("#stats").html(stathtml);
        
    }
    $(document).ready(function () {
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#start_time'
                ,trigger: 'click'
            });
            laydate.render({
                elem: '#end_time'
                ,trigger: 'click'
            });
        });
        initTable();
        $("#search").on("click", function(){
            initTable();
        });
    });
</script>
{include file="footer" /}
