<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑用户</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link href="__CSS__/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="__CSS__/font-awesome.min.css?v=4.4.0" rel="stylesheet">
    <link href="__CSS__/animate.min.css" rel="stylesheet">
    <link href="__CSS__/plugins/iCheck/custom.css" rel="stylesheet">
    <link href="__CSS__/style.min.css?v=4.1.0" rel="stylesheet">
    <link href="__JS__/layui/css/layui.css" rel="stylesheet">
    <link href="__LIBS__/select2-4.0.7/css/select2.min.css" rel="stylesheet">
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-8">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>{:lang("编辑用户")}</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="commentForm" method="post" action="{:url('member/userEdit')}">
                        <input type="hidden" name="id" value="{$user.id}">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("昵称")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="nick_name" type="text" class="form-control" name="nick_name" value="{$user.nick_name}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("手机号")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="mobile" type="text" class="form-control" name="mobile" required="" aria-required="true" value="{$user.mobile}" />
                            </div>
                        </div>
                        {if condition="$user['leader1'] && $user['parent']"}
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("上级用户信息")}：</label>
                            <div class="input-group col-sm-4">
                                <p class="form-control-static">{$user.parent.mobile}(ID:{$user.parent.id}) <a class="btn btn-danger btn-xs" href="{:url('edit_parent', ['userid' => $user.id])}">修改上级</a></p>
                            </div>
                        </div>
                        {else}
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("上级用户信息")}：</label>
                            <div class="input-group col-sm-4">
                                <p class="form-control-static">{:lang("无")} <a class="btn btn-danger btn-xs" href="{:url('edit_parent', ['userid' => $user.id])}">{:lang("修改上级")}</a></p>
                            </div>
                        </div>
                        {/if}
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("会员等级")}：</label>
                            <div class="input-group col-sm-4">
                                <select class="form-control" name="level_id">
                                    <option value="">{:lang("普通会员")}</option>
                                    {if !empty($level)}
                                    {foreach name="level" item="vo"}
                                    <option value="{$vo.level_id}" {if condition="$user['level_id'] eq $vo['level_id']"}selected{/if} >{$vo.level_name}</option>
                                    {/foreach}
                                    {/if}
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("真实姓名")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="true_name" type="text" class="form-control" name="true_name" value="{$user.true_name}" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("限制拼单次数")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="pd_num" type="number" class="form-control" name="pd_num" value="{$user.pd_num|intval}" />
                                <p class="help-block">用户每天拼单次数</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("USDT地址类型")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="text" class="form-control" name="usdt_type" value="{$user.usdt_type}" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("USDT地址")}：</label>
                            <div class="input-group col-sm-4">
                                <input type="text" class="form-control" name="usdt" value="{$user.usdt}" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("银行")}：</label>
                            <div class="input-group col-sm-4">
                                <select class="form-control" name="bank_name" id="bank_name">
                                    <option value="">{:lang("选择银行")}</option>
                                    {if !empty($banks)}
                                    {foreach name="banks" item="vo"}
                                    <option value="{$vo.bank_code}" {if $vo.bank_code eq $user.bank_name} selected{/if}>{$vo.name}</option>
                                    {/foreach}
                                    {/if}
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("银行账号")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="bank_number" type="text" class="form-control" name="bank_number" value="{$user.bank_number}" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("开户行")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="bank_kh" type="text" class="form-control" name="bank_kh" value="{$user.bank_kh}" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("支行地址")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="bank_address" type="text" class="form-control" name="bank_address" value="{$user.bank_address}" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("登录密码")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="paypwd" type="password" class="form-control" name="password" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("提现密码")}：</label>
                            <div class="input-group col-sm-4">
                                <input id="paypwd" type="password" class="form-control" name="paypwd" />
                            </div>
                        </div>
<!--                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("更新时间")}：</label>
                            <div class="input-group col-sm-4">
                                <p class="form-control-static">{$user.update_time}</p>
                            </div>
                        </div>-->
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("用户金额")}：</label>
                            <div class="input-group col-sm-4">
                                <p class="form-control-static">{$user.user_money}</p>
                            </div>
                        </div>
<!--                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("冻结金额")}：</label>
                            <div class="input-group col-sm-4">
                                <p class="form-control-static">{$user.frozen_money}</p>
                            </div>
                        </div>-->
<!--                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("虚拟账号")}：</label>
                            <div class="input-group col-sm-6">
                                <div class="radio i-checks col-sm-3">
                                    <label><input type="radio" value="1" name="is_xuni" {if condition="1 == $user['is_xuni']"}checked{/if}> <i></i> 是</label>
                                </div>
                                <div class="radio i-checks col-sm-3">
                                    <label><input type="radio" value="0" name="is_xuni" {if condition="0 == $user['is_xuni']"}checked{/if}> <i></i> 否</label>
                                </div>
                            </div>
                        </div>-->
                        <div class="form-group">
                            <label class="col-sm-3 control-label">{:lang("是否启用")}：</label>
                            <div class="input-group col-sm-4">
                                {foreach name='status' item='vo' key='key'}
                                <div class="radio i-checks col-sm-4">
                                    <label> <input type="radio" value="{$key}" name="status" {if condition="$key == $user['status']"}checked{/if}> <i></i> {$vo|lang}</label>
                                </div>
                                {/foreach}
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-6">
                                <!--<input type="button" value="提交" class="btn btn-primary" id="postform"/>-->
                                <button class="btn btn-primary" type="submit">{:lang("提交")}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="__JS__/jquery.min.js?v=2.1.4"></script>
<script src="__JS__/bootstrap.min.js?v=3.3.6"></script>
<script src="__JS__/content.min.js?v=1.0.0"></script>
<script src="__JS__/plugins/validate/jquery.validate.min.js"></script>
<script src="__JS__/plugins/validate/messages_zh.min.js"></script>
<script src="__JS__/plugins/iCheck/icheck.min.js"></script>
<script src="__JS__/plugins/layer/layer.min.js"></script>
<script src="__JS__/layui/layui.js"></script>
<script src="__JS__/jquery.form.js"></script>
<script src="__LIBS__/select2-4.0.7/js/select2.min.js"></script>
<script type="text/javascript">
    var index = '';
    function showStart(){
        index = layer.load(0, {shade: false});
        return true;
    }

    function showSuccess(res){
        layer.ready(function(){
            layer.close(index);
            if(1 == res.code){
                layer.alert(res.msg, {title: "{:lang('友情提示')}", icon: 1, closeBtn: 0}, function(){
                    window.location.href = res.data;
                });
            }else if(111 == res.code){
                window.location.reload();
            }else{
                layer.msg(res.msg, {anim: 6});
            }
        });
    }

    $(document).ready(function(){
        $(".i-checks").iCheck({checkboxClass:"icheckbox_square-green",radioClass:"iradio_square-green",});

        // 编辑用户
        var options = {
            beforeSubmit:showStart,
            success:showSuccess
        };

        $('#commentForm').submit(function(){
            $(this).ajaxSubmit(options);
            return false;
        });
        
        // 上传图片
        layui.use('upload', function(){
            var upload = layui.upload;
            //上传车辆照片
            var uploadInst = upload.render({
                elem: '#test1' //绑定元素
                ,url: "{:url('upload/upload')}" //上传接口
                ,done: function(res){
                    //上传完毕回调
                    $("#pic").val(res.data.path);
                    $("#sm1").html('<img src="' + res.data.src + '" style="width:40px;height: 40px;"/>');
                }
                ,error: function(){
                    //请求异常回调
                }
            });
        });
        $("#bank_name").select2();
    });

    // 表单验证
    $.validator.setDefaults({
        highlight: function(e) {
            $(e).closest(".form-group").removeClass("has-success").addClass("has-error")
        },
        success: function(e) {
            e.closest(".form-group").removeClass("has-error").addClass("has-success")
        },
        errorElement: "span",
        errorPlacement: function(e, r) {
            e.appendTo(r.is(":radio") || r.is(":checkbox") ? r.parent().parent().parent() : r.parent())
        },
        errorClass: "help-block m-b-none",
        validClass: "help-block m-b-none"
    });

</script>
</body>
</html>
